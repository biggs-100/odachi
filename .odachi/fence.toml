[[rule]]
not   = "a new verb, a new flag or a new grammar"
paths = ["a-new-verb-a-new-flag-or-a-new-grammar*"]
deps  = []

[[rule]]
not   = "renaming ODD-lite across the history: the old documents keep their words"
paths = ["renaming-odd-lite-across-the-history-the-old-documents-keep-their-words*"]
deps  = []

[[rule]]
not   = "a website, a manifesto or a logo"
paths = ["a-website-a-manifesto-or-a-logo*"]
deps  = []

[[rule]]
not   = "the panel itself"
paths = ["the-panel-itself*"]
deps  = []
