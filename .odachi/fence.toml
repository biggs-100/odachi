[[rule]]
not   = "the project-level .opencode/opencode.json"
paths = ["the-project-level-opencode-opencode-json*"]
deps  = []

[[rule]]
not   = "any OpenCode key other than default_agent"
paths = ["any-opencode-key-other-than-default-agent*"]
deps  = []

[[rule]]
not   = "overwriting an existing default: no force flag in the first version"
paths = ["overwriting-an-existing-default-no-force-flag-in-the-first-version*"]
deps  = []

[[rule]]
not   = "re-encoding the file or dropping comments"
paths = ["re-encoding-the-file-or-dropping-comments*"]
deps  = []

[[rule]]
not   = "a new dependency"
paths = ["a-new-dependency*"]
deps  = []
