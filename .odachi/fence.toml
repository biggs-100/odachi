[[rule]]
not   = "rewriting brief.md or the Requirements section"
paths = ["rewriting-brief-md-or-the-requirements-section*"]
deps  = []

[[rule]]
not   = "reopening a step that does not cite the requirement"
paths = ["reopening-a-step-that-does-not-cite-the-requirement*"]
deps  = []

[[rule]]
not   = "a new verb"
paths = ["a-new-verb*"]
deps  = []

[[rule]]
not   = "changing how a step is marked done"
paths = ["changing-how-a-step-is-marked-done*"]
deps  = []
