[[rule]]
not   = "rewriting the old task docs"
paths = ["rewriting-the-old-task-docs*"]
deps  = []

[[rule]]
not   = "changing the repository's merge strategy"
paths = ["changing-the-repository-s-merge-strategy*"]
deps  = []

[[rule]]
not   = "resolving a squashed step into the several commits it became"
paths = ["resolving-a-squashed-step-into-the-several-commits-it-became*"]
deps  = []

[[rule]]
not   = "a new verb, or a flag beyond the optional --commit"
paths = ["a-new-verb-or-a-flag-beyond-the-optional-commit*"]
deps  = []

[[rule]]
not   = "the panel itself"
paths = ["the-panel-itself*"]
deps  = []
