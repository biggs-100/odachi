[[rule]]
not   = "skipping tests or using -short in the proof"
paths = ["skipping-tests-or-using-short-in-the-proof*"]
deps  = []

[[rule]]
not   = "weakening doctor, fence or coverage checks, or deleting tests"
paths = ["weakening-doctor-fence-or-coverage-checks-or-deleting-tests*"]
deps  = []

[[rule]]
not   = "a new dependency or a custom test runner"
paths = ["a-new-dependency-or-a-custom-test-runner*"]
deps  = []

[[rule]]
not   = "changing the proof or verdict formats"
paths = ["changing-the-proof-or-verdict-formats*"]
deps  = []

[[rule]]
not   = "caching a proof across trees"
paths = ["caching-a-proof-across-trees*"]
deps  = []

[[rule]]
not   = "tuning GOMAXPROCS or -parallel to win the benchmark"
paths = ["tuning-gomaxprocs-or-parallel-to-win-the-benchmark*"]
deps  = []
