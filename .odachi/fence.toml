[[rule]]
not   = "copying the worktree or a sandbox per reviewer"
paths = ["copying-the-worktree-or-a-sandbox-per-reviewer*"]
deps  = []

[[rule]]
not   = "a transaction store with replay, CAS or locks"
paths = ["a-transaction-store-with-replay-cas-or-locks*"]
deps  = []

[[rule]]
not   = "resuming a killed process"
paths = ["resuming-a-killed-process*"]
deps  = []

[[rule]]
not   = "committing, restoring or reverting the reviewer's edits"
paths = ["committing-restoring-or-reverting-the-reviewer-s-edits*"]
deps  = []

[[rule]]
not   = "changing the reviewer command, the lens prompts or the gate's rule"
paths = ["changing-the-reviewer-command-the-lens-prompts-or-the-gate-s-rule*"]
deps  = []
