[[rule]]
not   = "changing the reviewer contract: the prompt still arrives on stdin and the answer still comes on stdout"
paths = ["changing-the-reviewer-contract-the-prompt-still-arrives-on-stdin-and-the-answer-still-comes-on-stdout*"]
deps  = []

[[rule]]
not   = "stripping ANSI or prose from stdout: the answer must be JSON, and decoration is the reviewer's problem"
paths = ["stripping-ansi-or-prose-from-stdout-the-answer-must-be-json-and-decoration-is-the-reviewer-s-problem*"]
deps  = []

[[rule]]
not   = "stamping the verdict's instant from the tool (recorded as its own decision, not this feature)"
paths = ["stamping-the-verdict-s-instant-from-the-tool-recorded-as-its-own-decision-not-this-feature*"]
deps  = []
