[[rule]]
not   = "a gate that checks whether the plan is committed: the tool cannot see the branch"
paths = ["a-gate-that-checks-whether-the-plan-is-committed-the-tool-cannot-see-the-branch*"]
deps  = []

[[rule]]
not   = "changing what start writes"
paths = ["changing-what-start-writes*"]
deps  = []

[[rule]]
not   = "an automatic commit from start"
paths = ["an-automatic-commit-from-start*"]
deps  = []
