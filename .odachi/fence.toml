[[rule]]
not   = "retrying a failed group inside the same run: the human runs the command again"
paths = ["retrying-a-failed-group-inside-the-same-run-the-human-runs-the-command-again*"]
deps  = []

[[rule]]
not   = "running model groups in parallel"
paths = ["running-model-groups-in-parallel*"]
deps  = []

[[rule]]
not   = "resuming a run that was killed: the store is the checkpoint, not a journal"
paths = ["resuming-a-run-that-was-killed-the-store-is-the-checkpoint-not-a-journal*"]
deps  = []

[[rule]]
not   = "changing the reviewer command, the lens prompts or the gate's rule"
paths = ["changing-the-reviewer-command-the-lens-prompts-or-the-gate-s-rule*"]
deps  = []

[[rule]]
not   = "prices, budgets or automatic model choice"
paths = ["prices-budgets-or-automatic-model-choice*"]
deps  = []
