[[rule]]
not   = "repairing the answer (ANSI, banners): the human repairs it before attaching"
paths = ["repairing-the-answer-ansi-banners-the-human-repairs-it-before-attaching*"]
deps  = []

[[rule]]
not   = "a reviewer that could not run, timed out or exited nonzero: no answer exists to keep"
paths = ["a-reviewer-that-could-not-run-timed-out-or-exited-nonzero-no-answer-exists-to-keep*"]
deps  = []

[[rule]]
not   = "teaching --attach to accept a raw stream"
paths = ["teaching-attach-to-accept-a-raw-stream*"]
deps  = []

[[rule]]
not   = "the panel itself"
paths = ["the-panel-itself*"]
deps  = []
