[[rule]]
not   = "changing the lens selection, the verdict format or the review store"
paths = ["changing-the-lens-selection-the-verdict-format-or-the-review-store*"]
deps  = []

[[rule]]
not   = "discovering the base from a remote or from the default branch"
paths = ["discovering-the-base-from-a-remote-or-from-the-default-branch*"]
deps  = []

[[rule]]
not   = "reviewing every step as its own unit"
paths = ["reviewing-every-step-as-its-own-unit*"]
deps  = []

[[rule]]
not   = "changing CI or the release workflow"
paths = ["changing-ci-or-the-release-workflow*"]
deps  = []

[[rule]]
not   = "a journal, CAS or resume machinery"
paths = ["a-journal-cas-or-resume-machinery*"]
deps  = []

[[rule]]
not   = "rewriting the task docs of features already closed"
paths = ["rewriting-the-task-docs-of-features-already-closed*"]
deps  = []
