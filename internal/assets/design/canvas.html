<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>odachi design</title>
<style>
  :root { color-scheme: light dark; --bg:#fafafa; --ink:#1b1b1b; --muted:#6b6b6b; --line:#e3e3e3; --accent:#7c3aed; --panel:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141414; --ink:#ececec; --muted:#9a9a9a; --line:#2c2c2c; --panel:#1c1c1c; } }
  * { box-sizing: border-box; }
  body { margin:0; font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; background:var(--bg); color:var(--ink); height:100vh; display:flex; flex-direction:column; }
  header { display:flex; gap:12px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); flex:0 0 auto; }
  header h1 { font-size:14px; margin:0 8px 0 0; font-weight:600; }
  header .spacer { flex:1; }
  button, select { font:inherit; color:inherit; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer; }
  button[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); }
  main { flex:1; display:flex; min-height:0; }
  #stage { flex:1; overflow:auto; position:relative; background: repeating-conic-gradient(from 0deg, transparent 0 20px, rgba(125,125,125,.04) 20px 40px); }
  #boards { display:flex; gap:40px; padding:40px; align-items:flex-start; transform-origin: top left; }
  .board { flex:0 0 auto; }
  .board h2 { font-size:13px; margin:0 0 6px; display:flex; gap:8px; align-items:baseline; }
  .board h2 small { color:var(--muted); font-weight:400; }
  .board h2 small.gap { color:var(--accent); border:1px solid currentColor; border-radius:4px; padding:0 5px; }
  .board iframe { border:1px solid var(--line); background:#fff; display:block; }
  aside { width:320px; border-left:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0; }
  aside h3 { margin:0; padding:12px 14px; font-size:13px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; }
  #comments { overflow:auto; padding:8px 10px; display:flex; flex-direction:column; gap:8px; }
  .comment { border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px; }
  .comment[data-status="resolved"] { opacity:.55; }
  .comment .meta { color:var(--muted); font-size:11px; font-family:ui-monospace, monospace; word-break:break-all; margin-bottom:4px; }
  .comment .actions { margin-top:6px; display:flex; gap:6px; }
  .comment .actions button { padding:2px 8px; font-size:12px; }
  .badge { font-size:11px; color:var(--accent); border:1px solid currentColor; border-radius:4px; padding:0 5px; white-space:nowrap; }
  .board.chosen { outline:2px solid var(--accent); outline-offset:8px; }
  .board h2 .compare { font-size:12px; padding:1px 8px; }
  #compare { position:fixed; inset:0; z-index:20; background:var(--bg); display:none; flex-direction:column; }
  #compare .panes { flex:1; display:flex; gap:12px; padding:12px; min-height:0; }
  #compare .panes > div { flex:1; display:flex; flex-direction:column; min-width:0; }
  #compare iframe { flex:1; width:100%; border:1px solid var(--line); background:#fff; }
  #compare a { color:var(--accent); }
  #popover { position:fixed; z-index:9; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; width:280px; box-shadow:0 10px 30px rgba(0,0,0,.15); display:none; }
  #popover textarea { width:100%; min-height:64px; font:inherit; color:inherit; background:transparent; border:1px solid var(--line); border-radius:6px; padding:6px; }
  #popover .row { display:flex; gap:6px; justify-content:flex-end; margin-top:8px; }
  #hint { padding:6px 14px; color:var(--muted); font-size:12px; border-bottom:1px solid var(--line); }
</style>
</head>
<body>
<header>
  <h1>odachi design</h1>
  <select id="design" aria-label="design"></select>
  <button id="mode" aria-pressed="false" title="Click an element in an artboard to leave a comment">Comment mode</button>
  <button id="fit" title="Fit the artboards to the window">Fit</button>
  <button id="zoom-out" aria-label="zoom out">&minus;</button>
  <span id="zoom" style="min-width:48px;text-align:center">100%</span>
  <button id="zoom-in" aria-label="zoom in">+</button>
  <span class="spacer"></span>
  <span id="state" style="color:var(--muted);font-size:12px"></span>
</header>
<div id="hint">Navigate: scroll or drag to pan, the wheel scrolls. Comment mode: click an element.</div>
<main>
  <div id="stage"><div id="boards"></div></div>
  <aside>
    <h3>Comments <span id="count" style="color:var(--muted);font-weight:400"></span></h3>
    <div id="comments"></div>
  </aside>
</main>
<div id="compare" role="dialog" aria-label="Compare the artboard with the running app">
  <header>
    <button id="compare-back">Back to canvas</button>
    <span class="spacer"></span>
    <a id="compare-open" target="_blank" rel="noreferrer">Open the app in a new tab</a>
  </header>
  <div class="panes">
    <div><h3>Artboard</h3><iframe id="compare-artboard" sandbox="allow-scripts" title="Artboard"></iframe></div>
    <div><h3>Running app</h3><iframe id="compare-app" title="Running app"></iframe></div>
  </div>
</div>
<div id="popover">
  <div class="meta" id="target"></div>
  <textarea id="text" placeholder="What should change here?"></textarea>
  <div class="row">
    <button id="cancel">Cancel</button>
    <button id="save">Save comment</button>
  </div>
</div>

<script>
(function () {
  "use strict";
  var state = { designs: [], slug: "", zoom: 1, comment: false, pending: null };
  var boards = document.getElementById("boards");
  var stage = document.getElementById("stage");
  var designSelect = document.getElementById("design");
  var commentsBox = document.getElementById("comments");
  var count = document.getElementById("count");
  var stateLine = document.getElementById("state");
  var popover = document.getElementById("popover");
  var target = document.getElementById("target");
  var text = document.getElementById("text");
  var compareBox = document.getElementById("compare");

  function api(path, options) {
    return fetch(path, options || {}).then(function (response) {
      if (!response.ok) { return response.json().then(function (body) { throw new Error(body.error || response.statusText); }); }
      return response.json();
    });
  }

  function el(tag, props, children) {
    var node = document.createElement(tag);
    Object.keys(props || {}).forEach(function (key) { node[key] = props[key]; });
    (children || []).forEach(function (child) { node.appendChild(child); });
    return node;
  }

  function current() {
    for (var i = 0; i < state.designs.length; i++) { if (state.designs[i].slug === state.slug) { return state.designs[i]; } }
    return null;
  }

  function render() {
    designSelect.innerHTML = "";
    state.designs.forEach(function (design) {
      var option = el("option", { value: design.slug, textContent: design.slug + " - " + design.manifest.title });
      option.selected = design.slug === state.slug;
      designSelect.appendChild(option);
    });

    boards.innerHTML = "";
    var design = current();
    if (!design) {
      stateLine.textContent = "no design in design/ yet";
      return;
    }

    design.manifest.artboards.forEach(function (artboard) {
      var handoffs = design.handoffs || { handoffs: {} };
      var entry = handoffs.handoffs && handoffs.handoffs[artboard.file];
      var chosen = handoffs.chosen === artboard.file;
      var frame = el("iframe", { title: artboard.title });
      // The artboard runs in a sandbox without allow-same-origin: the canvas cannot
      // read it, so the injected picker names the element it was clicked on.
      frame.setAttribute("sandbox", "allow-scripts");
      frame.width = artboard.width;
      frame.height = artboard.height;
      frame.dataset.file = artboard.file;
      frame.dataset.slug = design.slug;
      frame.src = design.urls[artboard.file];
      frame.addEventListener("load", function () {
        frame.contentWindow.postMessage({ type: "odachi:comment-mode", on: state.comment }, "*");
      });
      var notes = [el("small", { textContent: artboard.tradeoff })];
      if (!artboard.screenshot) {
        notes.push(el("small", { className: "gap", textContent: "no screenshot" }));
      }
      if (chosen) {
        notes.push(el("span", { className: "badge", textContent: "Chosen" }));
      } else if (handoffs.chosen) {
        notes.push(el("small", { className: "gap", textContent: "alternative" }));
      }
      if (entry) {
        notes.push(el("span", { className: "badge", textContent: entry.status === "in_progress" ? "Implementing…" : entry.status }));
      }
      if (entry && entry.previewUrl) {
        var compare = el("button", { className: "compare", textContent: "Compare" });
        compare.addEventListener("click", function () { compareWith(design, artboard, entry.previewUrl); });
        notes.push(compare);
      }
      var head = el("h2", { textContent: artboard.title }, notes);
      boards.appendChild(el("div", { className: chosen ? "board chosen" : "board" }, [head, frame]));
    });

    renderComments();
    applyZoom();
  }

  function renderComments() {
    var design = current();
    commentsBox.innerHTML = "";
    if (!design) { return; }
    var open = 0;
    design.comments.comments.forEach(function (comment) {
      if (comment.status === "open") { open++; }
      var meta = el("div", { className: "meta", textContent: comment.file + " - " + (comment.selector || "page") });
      var body = el("div", { textContent: comment.comment });
      var actions = el("div", { className: "actions" });
      if (comment.status === "open") {
        var resolve = el("button", { textContent: "Resolve" });
        resolve.addEventListener("click", function () { resolve_(comment.id); });
        actions.appendChild(resolve);
      } else {
        actions.appendChild(el("span", { className: "meta", textContent: "resolved" }));
      }
      var card = el("div", { className: "comment" }, [meta, body, actions]);
      card.setAttribute("data-status", comment.status);
      commentsBox.appendChild(card);
    });
    count.textContent = open + " open";
    stateLine.textContent = design.slug + " - " + design.comments.comments.length + " comments";
  }

  function applyZoom() {
    boards.style.transform = "scale(" + state.zoom + ")";
    document.getElementById("zoom").textContent = Math.round(state.zoom * 100) + "%";
  }

  // Compare shows the direction beside what it became: the artboard on the left,
  // the running app on the right, at the same size. The app may refuse to be framed,
  // so the open-in-a-tab link is always there.
  function compareWith(design, artboard, previewUrl) {
    document.getElementById("compare-artboard").src = design.urls[artboard.file];
    document.getElementById("compare-app").src = previewUrl;
    document.getElementById("compare-open").href = previewUrl;
    compareBox.style.display = "flex";
  }

  // A sandboxed artboard cannot be read by this page: it sends the element it was
  // clicked on, and the canvas turns that into the same pending comment as before.
  window.addEventListener("message", function (event) {
    var data = event.data || {};
    if (data.type !== "odachi:pick" || !state.comment) { return; }
    var frames = boards.querySelectorAll("iframe");
    for (var i = 0; i < frames.length; i++) {
      var frame = frames[i];
      if (frame.contentWindow !== event.source) { continue; }
      state.pending = {
        file: frame.dataset.file,
        selector: data.selector,
        excerpt: data.excerpt
      };
      target.textContent = frame.dataset.file + " - " + data.selector;
      text.value = "";
      var rect = frame.getBoundingClientRect();
      popover.style.display = "block";
      popover.style.left = Math.min(window.innerWidth - 300, rect.left + data.x * state.zoom) + "px";
      popover.style.top = Math.min(window.innerHeight - 190, rect.top + data.y * state.zoom) + "px";
      text.focus();
      return;
    }
  });

  function save() {
    if (!state.pending || !text.value.trim()) { return; }
    api("api/design/" + state.slug + "/comments", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        file: state.pending.file,
        selector: state.pending.selector,
        excerpt: state.pending.excerpt,
        comment: text.value.trim()
      })
    }).then(function () {
      popover.style.display = "none";
      state.pending = null;
      refresh();
    }).catch(function (error) { stateLine.textContent = error.message; });
  }

  function resolve_(id) {
    api("/api/design/" + state.slug + "/comments/" + id, { method: "POST" })
      .then(refresh)
      .catch(function (error) { stateLine.textContent = error.message; });
  }

  function refresh() {
    return api("api/designs").then(function (body) {
      state.designs = body.designs || [];
      if (!current() && state.designs.length) { state.slug = state.designs[0].slug; }
      render();
    }).catch(function (error) { stateLine.textContent = error.message; });
  }

  designSelect.addEventListener("change", function () {
    state.slug = designSelect.value;
    var url = new URL(window.location.href);
    url.searchParams.set("design", state.slug);
    window.history.replaceState(null, "", url);
    refresh();
  });

  document.getElementById("mode").addEventListener("click", function (event) {
    state.comment = !state.comment;
    event.currentTarget.setAttribute("aria-pressed", String(state.comment));
    document.getElementById("hint").textContent = state.comment
      ? "Comment mode: click an element in an artboard. Clicks do not follow links."
      : "Navigate: scroll or drag to pan, the wheel scrolls. Comment mode: click an element.";
    var frames = boards.querySelectorAll("iframe");
    for (var i = 0; i < frames.length; i++) {
      frames[i].contentWindow.postMessage({ type: "odachi:comment-mode", on: state.comment }, "*");
    }
  });

  document.getElementById("fit").addEventListener("click", function () {
    var design = current();
    if (!design) { return; }
    var widest = 0;
    design.manifest.artboards.forEach(function (artboard) { widest = Math.max(widest, artboard.width); });
    state.zoom = Math.min(1, (stage.clientWidth - 100) / (widest + 80));
    applyZoom();
  });

  document.getElementById("zoom-in").addEventListener("click", function () { state.zoom = Math.min(2, state.zoom + 0.1); applyZoom(); });
  document.getElementById("zoom-out").addEventListener("click", function () { state.zoom = Math.max(0.2, state.zoom - 0.1); applyZoom(); });
  document.getElementById("save").addEventListener("click", save);
  document.getElementById("cancel").addEventListener("click", function () { popover.style.display = "none"; state.pending = null; });
  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") {
      popover.style.display = "none";
      state.pending = null;
      compareBox.style.display = "none";
    }
  });
  document.getElementById("compare-back").addEventListener("click", function () { compareBox.style.display = "none"; });

  // The stream tells the page what moved: comments reload the panel, an artboard
  // reloads its frame. A canvas that is already open is refreshed instead of a new
  // tab, which is why the URL is stable.
  if (window.EventSource) {
    var stream = new EventSource("api/events");
    stream.onmessage = function (message) {
      // A second `odachi design open <slug>` asks the server to show that design
      // on this tab: the page moves, the URL stays, and no second tab is opened.
      if (message.data.indexOf("show:") === 0) {
        var wanted = message.data.slice(5);
        if (wanted) {
          state.slug = wanted;
          var url = new URL(window.location.href);
          url.searchParams.set("design", wanted);
          window.history.replaceState(null, "", url);
          refresh();
        }
        return;
      }
      var names = message.data.split(",");
      if (names.indexOf("comments") >= 0 || names.indexOf("handoffs") >= 0) { refresh(); }
      var frames = boards.querySelectorAll("iframe");
      for (var i = 0; i < frames.length; i++) {
        var frame = frames[i];
        var key = frame.dataset.slug + "/" + frame.dataset.file;
        if (names.indexOf(key) >= 0 || names.indexOf(frame.dataset.slug + "/design.json") >= 0) {
          frame.contentWindow.location.reload();
        }
      }
    };
  }

  var wanted = new URL(window.location.href).searchParams.get("design");
  api("api/designs").then(function (body) {
    state.designs = body.designs || [];
    state.slug = wanted && state.designs.some(function (d) { return d.slug === wanted; }) ? wanted : (state.designs[0] ? state.designs[0].slug : "");
    render();
  }).catch(function (error) { stateLine.textContent = error.message; });
})();
</script>
</body>
</html>
