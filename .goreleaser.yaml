# odachi · release config (goreleaser v2)
#
# What this file publishes, on purpose: six binaries (linux, macOS and windows,
# amd64 and arm64) inside their archives, checksums.txt, one keyless signature
# bundle for the checksums, and one SBOM per archive. The archives carry
# README.md and the MIT LICENSE the repository has.
#
# What it does NOT carry, also on purpose:
#
#   - `brews`: there is no Homebrew tap. An empty tap teaches people to install
#     something that never updates, and that is worse than having no recipe.
#   - Apple signing and notarization: there is no Apple identity. The signature
#     below proves which workflow published, not that macOS will open the file
#     without a warning, and pretending otherwise would be worse.
#   - provenance (SLSA, attestations): the signature says who published, the
#     SBOM says what is inside, and provenance would say which source produced
#     it. That is the next link in the chain, not this one.
#
# When the tap and the provenance exist they are added here. Until then this
# file tells the truth about what is published and what is not.

version: 2

project_name: odachi

builds:
  - id: odachi
    main: ./cmd/odachi
    binary: odachi
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: odachi
    ids:
      - odachi
    name_template: "odachi_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    # Windows gets a zip: the file explorer opens it with a double click.
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Keyless: cosign asks Fulcio for a short-lived certificate that names this
# workflow and this tag, records the signature in Rekor, and writes both into
# one bundle. There is no key in the repository and none in the runner.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

# One SBOM per archive: what a person downloads is the thing described, not
# the source tree it came from.
sboms:
  - artifacts: archive

# A snapshot carries "dev" in its name so it is never mistaken for a release.
snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
