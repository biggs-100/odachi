# The deterministic floor of `odachi review checks` (0279): a ruleset named, not
# inherited.
#
# The linters below are the ones golangci-lint 2.x calls "standard", written out
# here on purpose. A default that comes from the installed binary moves when the
# binary moves, and this project declares the check at CRITICAL: a linter that
# starts reporting on its own would block trees nobody touched. A linter joins this
# list when a person decides it should, and the run that adds it pays what it finds.
version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
