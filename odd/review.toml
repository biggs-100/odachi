# odachi: the schema that wrote this file; an older binary says upgrade instead of calling it broken
schema = 3
# odachi: the review is the human's decision; on requires it in check, off leaves it optional
mode = "on"
# the biggest prompt this project pays a reviewer for; a reviewer that stalls at a size does not answer late
# measured 2026-10-28: 89 KB closed in 46s on mimo-v2.6-flash, 122 KB stalled until the 600s timeout
# measured 2026-10-31: feature 0132's prompt is 113.7 KB -1869 new lines of clean.go and its tests- and
# 96 KB refused it before the call; the human raised the limit to 120 KB for this one
max_prompt_kb = 120
# odachi clean --apply keeps this many review records -the newest trees- and this many prompts
# a prompt is the question, not the evidence: it is the biggest file in the store and nothing reads it
keep_verdicts = 10
keep_prompts = 0

[lenses]
# measured 2026-11-04: mimo-v2.6-flash stalled twice (0190 and 0192) and DeepSeek
# answered both in seconds; the identity is the model, the variant is the effort
risk = "opencode-go/deepseek-v4.1-flash"
readability = "opencode-go/deepseek-v4.1-flash"
reliability = "opencode-go/deepseek-v4.1-flash"
resilience = "opencode-go/deepseek-v4.1-flash"

# the deterministic floor (0279): a linter is judged by its exit status, and this
# one failing is a CRITICAL row the review cannot approve past. The ruleset is
# pinned in .golangci.yml, so a linter upgrade cannot make it report on its own.
[[check]]
name = "lint"
command = "golangci-lint run ./..."
severity = "CRITICAL"

# the dependency half of the floor (0283): a CVE in a package the candidate calls
# is a defect no lens can see, and the exit status is git's answer. It reads the
# vulnerability database over the network, so a machine that cannot reach it
# fails the row instead of passing it.
[[check]]
name = "govulncheck"
command = "govulncheck ./..."
severity = "CRITICAL"



