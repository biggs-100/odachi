[[rule]]
not   = "no new verb and no new flag"
paths = ["no-new-verb-and-no-new-flag*"]
deps  = []

[[rule]]
not   = "no change to the proof format"
paths = ["no-change-to-the-proof-format*"]
deps  = []

[[rule]]
not   = "no relaxation of the closing tree"
paths = ["no-relaxation-of-the-closing-tree*"]
deps  = []
