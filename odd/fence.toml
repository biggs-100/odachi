# a rule names paths, not a phrase: a glob of the phrase's own words matches
# files named like the phrase and protects nothing.
#
# a rule protects a file the feature must not touch because touching it would be
# wrong - never a reason restated as a package (0120). A non-goal that names no
# path stays in the brief.
#
# written by hand after start (0132): start carries every non-goal as a template,
# and the rules below are the ones somebody gave paths. The rest live in brief.md.

[[rule]]
not   = "no change to `ui-craft` or `design`: a terminal is not a screen - back when one rule must hold for both"
paths = ["skills/ui-craft/**", "skills/design/**"]
deps  = []

[[rule]]
not   = "no runtime, installer, workflow, canvas or proof change - back when one of those paths changes"
paths = ["internal/app/bench/**", "internal/bench/**", "internal/domain/bench/**", "cmd/odachi/bench.go", "cmd/odachi/main.go", "scripts/install.ps1", "scripts/install.sh", ".github/workflows/**", "internal/assets/design/canvas.html", "internal/adapters/designserver/**", "internal/assets/design/plugin.ts", "proof/**"]
deps  = []
