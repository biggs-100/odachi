# a rule names paths, not a phrase: a glob of the phrase's own words matches
# files named like the phrase and protects nothing.
#
# a rule protects a file the feature must not touch because touching it would be
# wrong - never a reason restated as a package (0120).
#
# "no change to the lens content itself" and "no new verb" are decisions about what
# this policy lands, not files: the brief carries them and no glob can measure them.

[[rule]]
not   = "a stored proof is never rewritten, whatever the writer learns"
paths = ["proof/**"]
deps  = []

[[rule]]
not   = "the review's own question is not edited by the feature that improves a lens"
paths = ["internal/domain/review/prompt.go", "internal/domain/review/refute.go"]
deps  = []
