# a rule names paths, not a phrase: a glob of the phrase's own words matches
# files named like the phrase and protects nothing.
#
# a rule protects a file the feature must not touch because touching it would be
# wrong - never a reason restated as a package (0120).
#
# "no new flag" is a decision about what the feature does, not a file: the brief
# carries it.

[[rule]]
not   = "no change to how the reviewer runs: the stream is for the proof, and review --exec keeps its buffered call"
paths = ["internal/app/review/**"]
deps  = []

[[rule]]
not   = "the proof format does not change: the stream is not a second copy of the output"
paths = ["internal/domain/proof/**"]
deps  = []
