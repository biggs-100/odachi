# a rule names paths, not a phrase: a glob of the phrase's own words matches
# files named like the phrase and protects nothing.
#
# a rule protects a file the feature must not touch because touching it would be
# wrong - never a reason restated as a package (0120). A non-goal that names no
# path stays in the brief: "no change to what the check verifies" is a promise
# about behaviour, and no glob measures a promise. `internal/app/doctor` is
# deliberately absent: the line this feature adds lives there.
#
# written by hand after start (0132): start carries every non-goal as a template,
# and the rules below are the ones somebody gave paths. The rest live in brief.md.

[[rule]]
not   = "no change to the brief's format or to `start`"
paths = ["internal/domain/brief/**", "internal/app/start/**", "cmd/odachi/interview.go"]
deps  = []

[[rule]]
not   = "no change to the review or to the classifier"
paths = ["internal/app/review/**", "internal/domain/review/**"]
deps  = []

[[rule]]
not   = "no change to the judging half of the doctor"
paths = ["internal/domain/doctor/**"]
deps  = []

[[rule]]
not   = "no change to the stored proofs: never touched"
paths = ["proof/**"]
deps  = []

[[rule]]
not   = "no change to the skills or to the voice"
paths = ["skills/**", "internal/domain/persona/**"]
deps  = []

[[rule]]
not   = "no change to the design canvas, its token or the push plugin"
paths = ["internal/assets/design/canvas.html", "internal/adapters/designserver/**", "internal/assets/design/plugin.ts"]
deps  = []

[[rule]]
not   = "no change to the artboard format"
paths = ["internal/domain/design/design.go"]
deps  = []

[[rule]]
not   = "no change to the release workflow or to the installers"
paths = [".github/workflows/**", "scripts/install.ps1", "scripts/install.sh"]
deps  = []
