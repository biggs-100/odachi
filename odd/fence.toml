# a rule names paths, not a phrase: a glob of the phrase's own words matches
# files named like the phrase and protects nothing.
#
# a rule protects a file the feature must not touch because touching it would be
# wrong - never a reason restated as a package (0120).
#
# "no new verb" and "no second shape of light document" are decisions about what
# the feature does, not files: the brief carries them.

[[rule]]
not   = "a stored proof is never rewritten, whatever the writer learns"
paths = ["proof/**"]
deps  = []

[[rule]]
not   = "the review does not learn about lanes: a light feature's tree is judged like any other"
paths = ["internal/domain/review/**"]
deps  = []

# the proof keeps its shape is a decision of the brief, not a fence rule: 0150
# decided the fence guards the evidence (proof/**) and never the package that
# writes it, because a rule over the writer blocks its own improvement.
