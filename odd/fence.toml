[[rule]]
not   = "no new verb and no new flag"
paths = ["no-new-verb-and-no-new-flag*"]
deps  = []

[[rule]]
not   = "no change to when a verdict is refused"
paths = ["no-change-to-when-a-verdict-is-refused*"]
deps  = []

[[rule]]
not   = "the verdict schema does not change"
paths = ["the-verdict-schema-does-not-change*"]
deps  = []
