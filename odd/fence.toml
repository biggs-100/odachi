# a rule names paths, not a phrase: a glob of the phrase's own words matches
# files named like the phrase and protects nothing.
#
# a rule protects a file the feature must not touch because touching it would be
# wrong - never a reason restated as a package (0120). A non-goal that names no
# path stays in the brief: "no new verb" is a promise about behaviour, and no
# glob measures a promise.

[[rule]]
not   = "no change to what proof/ and odd/tasks are: never touched"
paths = ["proof/**"]
deps  = []

# The retention is the project's decision and the survival rule is 0188's: this
# feature changes how a stream reaches a human and how a timeout ends a run,
# never which files survive.
[[rule]]
not   = "no change to the retention numbers or which trees survive"
paths = ["odd/review.toml", "internal/domain/review/cleanup.go"]
deps  = []
