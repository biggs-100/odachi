[[rule]]
not   = "no new verb and no new flag"
paths = ["no-new-verb-and-no-new-flag*"]
deps  = []

[[rule]]
not   = "no change to where the verdicts live"
paths = ["no-change-to-where-the-verdicts-live*"]
deps  = []

[[rule]]
not   = "no refusal of a verdict stored before this feature, which still parses"
paths = ["no-refusal-of-a-verdict-stored-before-this-feature-which-still-parses*"]
deps  = []
