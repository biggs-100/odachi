[[rule]]
not   = "the stored proofs are the evidence this tree ran: the package that writes them may change, a proof that already exists may not"
paths = ["proof/**"]
deps  = []

[[rule]]
not   = "no se toca el contenido de los lentes: medir editando el examen no mide nada - back when the fixture or a lens changes for a reason this feature records"
paths = ["internal/assets/review/*.md"]
deps  = []

[[rule]]
not   = "no corre en CI ni en la gate: N veces una llamada a un modelo multiplica el costo - back when a cheap reviewer makes a probe per change affordable"
paths = [".github/workflows/**"]
deps  = []

[[rule]]
not   = "no se toca el fixture ni los lentes: la repeticion mide lo que ya existe"
paths = ["internal/probe/testdata/lenses/**"]
deps  = []

