# a rule names paths, not a phrase: a glob of the phrase's own words matches
# files named like the phrase and protects nothing.
#
# a rule protects a file the feature must not touch because touching it would be
# wrong - never a reason restated as a package (0120). A non-goal that names no
# path stays in the brief: "no new verb" and "the light lane stays" are promises
# about behaviour, and no glob measures a promise.

[[rule]]
not   = "a stored proof is never rewritten, whatever the writer learns"
paths = ["proof/**"]
deps  = []

# The question a reviewer reads is the bytes it was paid for: the cleanup may
# decide which prompt files survive, never what one says.
[[rule]]
not   = "no change to the bytes of a verdict or of a prompt"
paths = ["internal/domain/review/prompt.go"]
deps  = []

# The lifetimes are the project's decisions, so the feature that obeys them must
# not edit them: a number changed here would hide whether the code reads it.
[[rule]]
not   = "the retention is the project's decision, not this feature's"
paths = ["odd/review.toml"]
deps  = []
