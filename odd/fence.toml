# a rule names paths, not a phrase: a glob of the phrase's own words matches
# files named like the phrase and protects nothing.
#
# "no change to what an open feature owes" and "no change to what the closing tree
# owes" are not paths: they are behaviour, and they live in the brief's Done when.

[[rule]]
not   = "no new verb and no new flag"
paths = ["cmd/odachi/main.go"]
deps  = []

[[rule]]
not   = "no change to the verdict shape"
paths = ["internal/domain/review/review.go", "internal/domain/review/dismiss*.go", "internal/domain/review/refute.go", "internal/adapters/reviewtoml/**", "internal/adapters/agentstoml/**"]
deps  = []

[[rule]]
not   = "no change to the proof format, and the stored proof is never rewritten"
paths = ["internal/domain/proof/**", "proof/**"]
deps  = []
