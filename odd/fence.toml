# a rule names paths, not a phrase: a glob of the phrase's own words matches
# files named like the phrase and protects nothing.
#
# a rule protects what its own name says; every path it lists is described there,
# because a folder under a name that does not mention it blocks the first feature
# that needs it (0117 paid for that lesson, 0118 corrected it).

[[rule]]
not   = "no change to the proof format, and the stored proof is never rewritten"
paths = ["internal/domain/proof/**", "proof/**"]
deps  = []

[[rule]]
not   = "no change to how a skill or the door is written: the report learns to speak first"
paths = ["internal/app/pack/**", "internal/domain/persona/persona.go"]
deps  = []
