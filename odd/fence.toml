# a rule names paths, not a phrase: a glob of the phrase's own words matches
# files named like the phrase and protects nothing.
#
# a rule protects a file the feature must not touch because touching it would be
# wrong - never a reason restated as a package (0120).
#
# "no new artifact kind" and "no guessing when the worktree is dirty" are
# decisions about what the feature does, not files: the brief carries them.

[[rule]]
not   = "a stored proof is never rewritten, whatever the writer learns"
paths = ["proof/**"]
deps  = []

[[rule]]
not   = "undo still never touches git: a repair names the commit, it does not run one"
paths = ["internal/adapters/gitx/**"]
deps  = []

[[rule]]
not   = "the gate still judges and never writes: a record is repaired by the verb that made it"
paths = ["internal/app/check/**", "internal/domain/gate/**"]
deps  = []
