[[rule]]
not   = "no new verb and no new flag"
paths = ["no-new-verb-and-no-new-flag*"]
deps  = []

[[rule]]
not   = "no change to how a number is chosen for a slug nobody used"
paths = ["no-change-to-how-a-number-is-chosen-for-a-slug-nobody-used*"]
deps  = []

[[rule]]
not   = "no rewrite of an existing task document"
paths = ["no-rewrite-of-an-existing-task-document*"]
deps  = []
