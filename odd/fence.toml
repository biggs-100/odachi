# a rule names paths, not a phrase: a glob of the phrase's own words matches
# files named like the phrase and protects nothing.
#
# "no change to what a closed feature owes" is not a path: it is behaviour, and it
# lives in the brief's Done when ("the tree that marks the last step still owes the
# verdict at the document's base"). A rule here would have to fence the function
# this feature is allowed to change.

[[rule]]
not   = "no new verb and no new flag"
paths = ["cmd/odachi/main.go"]
deps  = []

[[rule]]
not   = "no change to the verdict or the proof format"
paths = ["internal/domain/review/**", "internal/domain/proof/**", "internal/adapters/reviewtoml/**", "internal/adapters/agentstoml/**"]
deps  = []
