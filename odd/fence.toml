# a rule names paths, not a phrase: a glob of the phrase's own words matches
# files named like the phrase and protects nothing.
#
# a rule protects a file the feature must not touch because touching it would be
# wrong - never a reason restated as a package (0120). A non-goal that names no
# path stays in the brief: the worker's refusal and the door are promises about
# text, and no auto-delegation is a promise about behaviour. `internal/domain/persona/**`
# is deliberately absent: this feature reads nothing there, and the promises live
# in the brief.
#
# written by hand after start (0132): start carries every non-goal as a template,
# and the rules below are the ones somebody gave paths. The rest live in brief.md.

[[rule]]
not   = "no change to the skills: drive and slices keep their text, and the block names the verb"
paths = ["skills/**"]
deps  = []

[[rule]]
not   = "no change to odachi bench and no new verb beyond delegate"
paths = ["internal/app/bench/**", "internal/bench/**", "internal/domain/bench/**", "cmd/odachi/bench.go"]
deps  = []

[[rule]]
not   = "no change to the brief format or to start"
paths = ["internal/domain/brief/**", "internal/app/start/**", "cmd/odachi/interview.go"]
deps  = []

[[rule]]
not   = "no change to the review, the doctor or the classifier"
paths = ["internal/app/review/**", "internal/app/doctor/**", "internal/domain/doctor/**", "internal/domain/review/**"]
deps  = []

[[rule]]
not   = "no change to the stored proofs: never touched"
paths = ["proof/**"]
deps  = []

[[rule]]
not   = "no change to the design canvas, its token or the installers"
paths = ["internal/assets/design/canvas.html", "internal/adapters/designserver/**", "internal/assets/design/plugin.ts", "scripts/install.ps1", "scripts/install.sh"]
deps  = []

[[rule]]
not   = "no change to the release workflow"
paths = [".github/workflows/**"]
deps  = []
