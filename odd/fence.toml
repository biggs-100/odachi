# a rule names paths, not a phrase: a glob of the phrase's own words matches
# files named like the phrase and protects nothing.

[[rule]]
not   = "no change to the proof format, and the stored proof is never rewritten"
paths = ["internal/domain/proof/**", "proof/**"]
deps  = []

[[rule]]
not   = "no change to odachi pack, and no new verb: the scope is a key in the store and a flag init already has"
paths = ["internal/app/pack/**"]
deps  = []

[[rule]]
not   = "no change to which clients receive the native agent"
paths = ["internal/domain/persona/selection.go", "internal/app/init/personas.go"]
deps  = []
