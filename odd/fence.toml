# a rule names paths, not a phrase: a glob of the phrase's own words matches
# files named like the phrase and protects nothing.
#
# a rule protects a file the feature must not touch because touching it would be
# wrong - never a reason restated as a package (0120). A non-goal that names no
# path stays in the brief: "no new verb" is a promise about behaviour, and no
# glob measures a promise.

[[rule]]
not   = "no change to the four hard rules, the fence, the gate or the review"
paths = ["internal/domain/rules/rules.go", "internal/app/check/**", "internal/domain/gate/**", "internal/app/review/**", "internal/domain/review/**"]
deps  = []

[[rule]]
not   = "no change to the stored proofs: never touched"
paths = ["proof/**"]
deps  = []

[[rule]]
not   = "no new verb and no new flag"
paths = ["cmd/odachi/main.go"]
deps  = []

[[rule]]
not   = "no change to which profile is earned or inferred by odachi level"
paths = ["internal/domain/profile/**", "internal/app/level/**"]
deps  = []

[[rule]]
not   = "no retroactive rewrite of an existing block: a project receives the voice when it runs odachi init or level"
paths = ["AGENTS.md"]
deps  = []
