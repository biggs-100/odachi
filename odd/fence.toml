# a rule names paths, not a phrase: a glob of the phrase's own words matches
# files named like the phrase and protects nothing.
#
# a rule protects a file the feature must not touch because touching it would be
# wrong - never a reason restated as a package (0120). A non-goal that names no
# path stays in the brief.
#
# written by hand after start (0132): start carries every non-goal as a template,
# and the rules below are the ones somebody gave paths. The rest live in brief.md.
#
# 0258: main.go is not a path this feature must not touch -it carries the help
# text the new surface needs- so the installer rule names the installer paths and
# not the CLI entry point (the 0252 lesson).

[[rule]]
not   = "no change to delegate: it keeps printing the paths this verb reads"
paths = ["cmd/odachi/delegate.go", "internal/app/delegate/**"]
deps  = []

[[rule]]
not   = "no change to the installer, the workflow, the canvas or the proofs"
paths = ["scripts/install.ps1", "scripts/install.sh", ".github/workflows/**", "internal/assets/design/canvas.html", "internal/adapters/designserver/**", "internal/assets/design/plugin.ts", "proof/**"]
deps  = []
