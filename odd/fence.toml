# a rule names paths, not a phrase: a glob of the phrase's own words matches
# files named like the phrase and protects nothing.
#
# a rule protects a file the feature must not touch because touching it would be
# wrong - never a reason restated as a package (0120). A non-goal that names no
# path stays in the brief: "no new verb" is a promise about behaviour, and no
# glob measures a promise.

[[rule]]
not   = "no change to the design canvas, its token or the push plugin"
paths = ["internal/adapters/designserver/**", "internal/assets/design/canvas.html", "internal/assets/design/plugin.ts"]
deps  = []

[[rule]]
not   = "no change to the voice or the interview's questions"
paths = ["internal/domain/persona/**", "internal/app/start/**", "cmd/odachi/interview.go"]
deps  = []

[[rule]]
not   = "no change to the artboard format"
paths = ["internal/domain/design/design.go"]
deps  = []

[[rule]]
not   = "no change to the stored proofs: never touched"
paths = ["proof/**"]
deps  = []

[[rule]]
not   = "no change to the release workflow"
paths = [".github/workflows/**"]
deps  = []
