# a rule names paths, not a phrase: a glob of the phrase's own words matches
# files named like the phrase and protects nothing.
#
# a rule protects a file the feature must not touch because touching it would be
# wrong - never a reason restated as a package (0120). A non-goal that names no
# path stays in the brief: "no new verb" is a promise about behaviour, and no
# glob measures a promise.
#
# written by hand after start (0132): start carries every non-goal as a template,
# and the rules below are the ones somebody gave paths. The rest live in brief.md.

[[rule]]
not   = "no change to the canvas: a focused board already hides the shield and lets the artboard receive the pointer, and the button copies text in the page"
paths = ["internal/assets/design/canvas.html", "internal/adapters/designserver/**", "internal/assets/design/plugin.ts"]
deps  = []

[[rule]]
not   = "no change to the design folder, the manifest, `comments.json` or the handoff"
paths = ["skills/design/references/files.md", "internal/domain/design/**", "internal/app/design/**", "cmd/odachi/design.go"]
deps  = []

[[rule]]
not   = "no change to the design verbs or the ODD link"
paths = ["cmd/odachi/design.go", "internal/app/design/**"]
deps  = []

[[rule]]
not   = "no change to the other references of `ui-craft` or `design`"
paths = ["skills/ui-craft/references/the-tells.md", "skills/ui-craft/references/the-numbers.md", "skills/ui-craft/references/motion.md", "skills/ui-craft/references/the-read.md", "skills/ui-craft/references/browse-and-compare.md"]
deps  = []

[[rule]]
not   = "no change to the voice or the interview's questions"
paths = ["internal/domain/persona/**", "internal/app/start/**", "cmd/odachi/interview.go"]
deps  = []

[[rule]]
not   = "no change to the stored proofs: never touched"
paths = ["proof/**"]
deps  = []

[[rule]]
not   = "no change to `odachi role` or to the skill it renders"
paths = ["internal/app/role/**", "internal/domain/role/**"]
deps  = []

[[rule]]
not   = "no change to the artboard format"
paths = ["internal/domain/design/design.go"]
deps  = []

[[rule]]
not   = "no change to the release workflow"
paths = [".github/workflows/**"]
deps  = []

[[rule]]
not   = "no change to the skills the feature does not touch: tests, drive, writing, pull-request, commits and triage"
paths = ["skills/tests/**", "skills/drive/**", "skills/writing/**", "skills/pull-request/**", "skills/commits/**", "skills/triage/**"]
deps  = []
