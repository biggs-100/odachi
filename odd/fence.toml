# a rule names paths, not a phrase: a glob of the phrase's own words matches
# files named like the phrase and protects nothing.
#
# a rule protects a file the feature must not touch because touching it would be
# wrong - never a reason restated as a package (0120).

[[rule]]
not   = "a stored proof is never rewritten, whatever the writer learns"
paths = ["proof/**"]
deps  = []

[[rule]]
not   = "the bundled skills that ship today are not edited; a new one is its own feature"
paths = [
"skills/acceptance/**", "skills/bootstrap/**", "skills/commits/**", "skills/data/**", "skills/drive/**", "skills/go-tests/**", "skills/pull-request/**", "skills/role-craft/**", "skills/shape/**", "skills/ship/**", "skills/skill-craft/**", "skills/skill-improve/**", "skills/slices/**", "skills/tests/**", "skills/triage/**", "skills/writing/**"
]
deps  = []
