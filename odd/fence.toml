# a rule names paths, not a phrase: a glob of the phrase's own words matches
# files named like the phrase and protects nothing.
#
# a rule protects a file the feature must not touch because touching it would be
# wrong - never a reason restated as a package (0120).
#
# "no new flag" and "no repair of an old document" are decisions about what the
# feature does, not files: the brief carries them.

[[rule]]
not   = "a stored proof is never rewritten, whatever the writer learns"
paths = ["proof/**"]
deps  = []

[[rule]]
not   = "the review does not learn to read a step tail or an artifact name: it judges the four artifacts it already judges"
paths = ["internal/domain/review/**"]
deps  = []

[[rule]]
not   = "the gate still judges and never repairs: the parser and undo are where a name is read"
paths = ["internal/domain/gate/**", "internal/app/check/**"]
deps  = []
