# a rule names paths, not a phrase: a glob of the phrase's own words matches
# files named like the phrase and protects nothing.
#
# a rule protects a file the feature must not touch because touching it would be
# wrong - never a reason restated as a package (0120). A non-goal that names no
# path stays in the brief: "no new verb" is a promise about behaviour, and no
# glob measures a promise.

[[rule]]
not   = "no change to the production kill path"
paths = ["internal/adapters/shellcmd/shellcmd.go", "internal/adapters/shellcmd/shellcmd_windows.go", "internal/adapters/shellcmd/shellcmd_unix.go", "internal/adapters/shellcmd/shellcmd_unsupported.go"]
deps  = []

[[rule]]
not   = "no change to the voice or the interview"
paths = ["internal/domain/persona/**", "internal/app/start/**", "cmd/odachi/interview.go"]
deps  = []

[[rule]]
not   = "no change to the gate, the review, the proof format or the artboard format"
paths = ["internal/app/check/**", "internal/domain/gate/**", "internal/app/review/**", "internal/domain/review/**", "internal/domain/design/design.go"]
deps  = []

[[rule]]
not   = "no change to the stored proofs: never touched"
paths = ["proof/**"]
deps  = []

# "No new flag and no new verb" is a promise about behaviour, not a path: a rule
# over cmd/odachi/main.go would refuse the help text this feature corrects, and the
# doctrine keeps a behaviour in the brief (0120). The diff adds no flag and no verb.
