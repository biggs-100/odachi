name: gate

# The gate must not be code the candidate can edit. This job builds odachi from
# the base ref (the trusted source) and runs it against the candidate worktree,
# reading the fence from the base ref too: a change cannot loosen the policy it
# must obey. The proof is uploaded even when the gate fails.
#
# The gate binary is trusted. The workflow file is not: it comes from the change.
# That is why `.github/` has a CODEOWNERS entry and the repository ruleset must
# require a code-owner review for it. Mark this job as a required check only when
# the project is ready to stop pushing to main directly.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: build the gate from the base ref
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          [ -n "$base" ] || base=origin/main
          git worktree add ../gate "$base"
          (cd ../gate && go build -o "$RUNNER_TEMP/odachi" ./cmd/odachi)

      - name: run the gate
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          [ -n "$base" ] || base=origin/main
          "$RUNNER_TEMP/odachi" check --fence-from "$base" --run "go test ./..."

      - name: keep the proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof
          path: proof/
          if-no-files-found: warn
