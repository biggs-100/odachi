name: gate

# One workflow, one truth about a tree. The gate must not be code the candidate
# can edit: odachi is built from the base ref (the trusted source) and runs
# against the candidate worktree, reading the fence from the base ref too, so a
# change cannot loosen the policy it must obey.
#
# The base is the PR base on a pull request and github.event.before on a push:
# origin/main after checkout is the pushed commit itself, which compares to
# nothing. The fence is then applied to the paths that differ from that base.
#
# A proof is written when the --run command exits 0. A failing command leaves
# none and the gate reports only its last line, so a red command is diagnosed
# from that line. When the gate blocks for another reason (the fence, an open
# question) the proof of that green run is still uploaded.
#
# The gate binary is trusted. The workflow file is not: it comes from the change.
# That is why `.github/` has a CODEOWNERS entry and the repository ruleset must
# require a code-owner review for it. Mark these jobs as required checks only when
# the project is ready to stop pushing to main directly.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The suite runs on every OS odachi ships to, and each OS keeps its own proof:
  # a green ubuntu says nothing about Windows, and a proof is evidence for the
  # tree, not for the machine that happened to run it.
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: build the gate from the base ref
        shell: bash
        run: |
          # The base is what the candidate cannot edit: on a pull request it is
          # the PR base; on a push to main it is the previous tip (before), since
          # origin/main is the pushed commit itself and would compare it to
          # nothing. A zero SHA (new branch) falls back to origin/main.
          base="${{ github.event.pull_request.base.sha }}"
          [ -n "$base" ] || base="${{ github.event.before }}"
          case "$base" in
            ""|0000000000000000000000000000000000000000) base=origin/main ;;
          esac
          echo "BASE=$base" >> "$GITHUB_ENV"

          git worktree add ../gate "$base"

          bin="$RUNNER_TEMP/odachi"
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$bin.exe"; fi
          (cd ../gate && go build -o "$bin" ./cmd/odachi)

          echo "ODACHI_GATE=$bin" >> "$GITHUB_ENV"

      - name: run the gate
        shell: bash
        run: |
          # --fence-from reads the policy from the base ref; --base compares the
          # changed paths against it. Without --base the worktree is compared to
          # its own HEAD, which on a clean checkout is nothing: the fence would be
          # applied to an empty list and the change would never meet it.
          # --no-review stays one release longer: the gate is built from the base
          # ref, and the base of this change is v0.11.84, which still refuses a close
          # without a verdict. The release that installs ADR 0043 removes the flag in
          # the change after it, the way a schema key waits for the binary that reads
          # it.
          "$ODACHI_GATE" check --fence-from "$BASE" --base "$BASE" --no-review --run "go test ./..." --timeout 900

      - name: keep the proof
        # always: a green run still has a proof to keep when the gate blocks on
        # the fence; when the command itself failed there is no proof, only the
        # last line the gate reports.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-${{ matrix.os }}
          path: proof/
          if-no-files-found: warn

  # Beside the gate, not in a second workflow: formatting, vet, the race
  # detector and the release config are static truths about the same tree. The
  # race detector runs the same tests with a different instrument, so it is a
  # second measurement, not a second opinion. A failure here fails the workflow
  # without hiding the gate's proof.
  checks:
    name: checks (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt -l . (fails when it prints anything)
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not formatted; run gofmt -w . :"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet ./...
        run: go vet ./...

      - name: go test -race ./internal/...
        run: go test -race ./internal/...

      - name: goreleaser check
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
