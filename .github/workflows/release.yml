name: release

# A release is a human decision: pushing a tag publishes. A manual run never
# publishes anything: it attests a release that is already out, which is the
# recovery path for a failed attestation step.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  # Keyless signing: the OIDC token is the identity cosign signs with. No key
  # to store, rotate or leak, and the certificate names this workflow and tag.
  id-token: write
  # Provenance: the attestation is written to the repository, not to the
  # release, and gh fetches it by digest.
  attestations: write

jobs:
  # Push only: a manual dispatch must never publish. Without this line the job
  # would run on the recovery dispatch and publish a second time.
  goreleaser:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Every action in this job holds the OIDC identity, so every one pins a
      # SHA. A moved tag here could ask Fulcio for this workflow's identity,
      # sign its own checksums and rewrite the release: verify-blob would pass.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The gate before the gate: a tag must not publish a red tree.
      - run: go test ./...

      # cosign v3: the signature lands as one bundle, not a .sig plus a .pem.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # goreleaser catalogues each archive with syft; the binary must be there.
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      # This one runs cosign, so it is the pin that matters most. v7.3.0.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Provenance, after the release exists: every archive named in the signed
      # checksums gets an attestation that says which workflow, commit and tag
      # produced it. v4.2.2.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: ./dist/checksums.txt

  # The attestation runs after the release is public, so a failure there leaves
  # a release with no provenance. This job is the fix: dispatch the workflow on
  # the tag and it attests the bytes already published, without building,
  # signing or uploading anything. It never creates a release.
  attest-retry:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release download "$TAG" --dir dist

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: ./dist/checksums.txt
