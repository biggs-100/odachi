name: release

# A release is a human decision: this workflow runs only when a tag is pushed.
# Pushing `v0.1.0` is what publishes; nothing here runs on a branch.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Keyless signing: the OIDC token is the identity cosign signs with. No key
  # to store, rotate or leak, and the certificate names this workflow and tag.
  id-token: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The gate before the gate: a tag must not publish a red tree.
      - run: go test ./...

      # Both actions run with id-token: write, so a moved tag could ask Fulcio
      # for this workflow's identity, sign its own checksums and rewrite the
      # release: verify-blob would still pass. The SHA is the only pin a tag
      # cannot move. cosign-installer v4.1.2, download-syft v0.24.3.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # goreleaser catalogues each archive with syft; the binary must be there.
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
