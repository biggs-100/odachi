name: release

# A release is a human decision: this workflow runs only when a tag is pushed.
# Pushing `v0.1.0` is what publishes; nothing here runs on a branch.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Keyless signing: the OIDC token is the identity cosign signs with. No key
  # to store, rotate or leak, and the certificate names this workflow and tag.
  id-token: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The gate before the gate: a tag must not publish a red tree.
      - run: go test ./...

      # cosign v3: the signature lands as one bundle, not a .sig plus a .pem.
      - uses: sigstore/cosign-installer@v4

      # goreleaser catalogues each archive with syft; the binary must be there.
      - uses: anchore/sbom-action/download-syft@v0

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
