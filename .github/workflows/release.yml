name: release

# A release is a human decision: this workflow runs only when a tag is pushed.
# Pushing `v0.1.0` is what publishes; nothing here runs on a branch.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Keyless signing: the OIDC token is the identity cosign signs with. No key
  # to store, rotate or leak, and the certificate names this workflow and tag.
  id-token: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      # Every action in this job holds the OIDC identity, so every one pins a
      # SHA. A moved tag here could ask Fulcio for this workflow's identity,
      # sign its own checksums and rewrite the release: verify-blob would pass.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The gate before the gate: a tag must not publish a red tree.
      - run: go test ./...

      # cosign v3: the signature lands as one bundle, not a .sig plus a .pem.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # goreleaser catalogues each archive with syft; the binary must be there.
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      # This one runs cosign, so it is the pin that matters most. v7.3.0.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
